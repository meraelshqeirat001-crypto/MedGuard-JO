
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedGuard-JO | الرعاية الصحية</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f5f5, #f4f8fc);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 35px 25px;
      border-radius: 22px;
      box-shadow: 0 10px 35px rgba(0, 70, 90, 0.12);
      text-align: center;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      color: #087e8b;
      margin: 5px 0;
      font-size: 30px;
    }

    .subtitle {
      color: #687b85;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .field {
      text-align: right;
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #344b55;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d6e3e8;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #087e8b;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #087e8b;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #06636e;
    }

    .footer {
      color: #82939b;
      font-size: 12px;
      margin-top: 25px;
    }

    #message {
      color: #087e8b;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">🩺</div>

    <h1>MedGuard-JO</h1>

    <p class="subtitle">
      نظام الرعاية الصحية وإدارة المرضى
      <br>
      أهلاً بك، سجّل الدخول للمتابعة
    </p>

    <form id="loginForm">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input
          type="email"
          id="email"
          placeholder="أدخل بريدك الإلكتروني"
          required
        >
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <input
          type="password"
          id="password"
          placeholder="أدخل كلمة المرور"
          required
        >
      </div>

      <button type="submit">تسجيل الدخول</button>
    </form>

    <p id="message"></p>

    <div class="footer">
      MedGuard-JO © 2026
      <br>
      Healthcare Management System
    </div>
  </div>

  
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyD9SGu6M1EA0jdDWnFwXkbLtXwLB2dMGrw",
    authDomain: "medguard-jo-44dea.firebaseapp.com",
    projectId: "medguard-jo-44dea",
    storageBucket: "medguard-jo-44dea.firebasestorage.app",
    messagingSenderId: "618451106292",
    appId: "1:618451106292:web:ef904e8f0c11286cf5e1a1",
    measurementId: "G-RNYHFZPY2W"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);

  // Firebase Services
  const auth = firebase.auth();
  const db = firebase.firestore();

  // Login Form
  document.getElementById("loginForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      message.textContent = "جاري تسجيل الدخول...";

      try {
        const userCredential =
          await auth.signInWithEmailAndPassword(email, password);

        message.textContent =
          "تم تسجيل الدخول بنجاح! مرحبًا بك في MedGuard-JO.";

        console.log("Logged in user:", userCredential.user.uid);

      } catch (error) {

        console.error("Login error:", error);

        if (error.code === "auth/invalid-credential") {
          message.textContent =
            "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
        } else if (error.code === "auth/too-many-requests") {
          message.textContent =
            "محاولات كثيرة. يرجى المحاولة لاحقًا.";
        } else {
          message.textContent =
            "حدث خطأ أثناء تسجيل الدخول: " + error.message;
        }
      }
    });
</script>
</body>
</html>
